<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FY27 DocOps Operations</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #172b4d;
        background: #f5f7fa;
      }
      body {
        margin: 0;
        padding: 3rem 1.25rem;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 2.5rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(23, 43, 77, 0.1);
      }
      h1 {
        margin-top: 0;
        color: #0067c5;
      }
      .dashboards {
        display: grid;
        gap: 1rem;
        margin: 2rem 0;
      }
      .dashboard {
        padding: 1.25rem;
        border: 1px solid #dfe1e6;
        border-radius: 8px;
      }
      .dashboard h2 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }
      .dashboard p {
        margin: 0;
        color: #5e6c84;
      }
      a {
        color: #0067c5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FY27 DocOps Operations</h1>
      <p>Ceremony readiness and delivery views for the NetApp DocOps FY27 operating cadence.</p>
      <section class="dashboards" aria-label="FY27 dashboards">
        <article class="dashboard">
          <h2>Ceremony readiness</h2>
          <p>Triage, icebox, and backlog-refinement preparation.</p>
        </article>
        <article class="dashboard">
          <h2>Delivery overview</h2>
          <p>Commitments, outcomes, capacity, and work in progress.</p>
        </article>
      </section>
      <p><a href="../">Back to DocOps</a></p>
    </main>
  </body>
</html>
